name: macOS

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15-intel ]
        mode: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCISTA_FMT=OFF -DCMAKE_CXX_FLAGS="-Wno-poison-system-directories"
          cmake --build build --target cista-test cista-test-single-header cista-abi-test -j 4

      - name: Run Tests
        run: ./build/cista-test

      - name: Run Single Header Tests
        run: ./build/cista-test-single-header
