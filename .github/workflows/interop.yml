name: Interop

# Every platform writes a buffer with CISTA_64BIT_OFFSET (tools/interop), then
# every platform reads and checks the buffers of all platforms. The buffers
# are not byte-identical: padding bytes are uninitialized.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write:
    name: write (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86, os: ubuntu-latest, flags: "-m32 -DCISTA_SKIP_ALIGNMENT_CHECK" }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: windows-x86, os: windows-latest, arch: x86 }
          - { name: windows-x64, os: windows-latest, arch: amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - name: Install 32bit toolchain
        if: matrix.name == 'linux-x86'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          choco install ninja
          cmake -GNinja -S . -B build -DCMAKE_BUILD_TYPE=Release -DCISTA_FMT=OFF -DCISTA_64BIT_OFFSET=ON
          cmake --build build --target cista-interop

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCISTA_FMT=OFF \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCISTA_64BIT_OFFSET=ON
          cmake --build build --target cista-interop

      - name: Write
        shell: bash
        run: |
          mkdir out
          cp build/cista-interop* out/
          ./out/cista-interop write out/${{ matrix.name }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: interop-${{ matrix.name }}
          path: out/

  read:
    name: read (${{ matrix.name }})
    needs: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86, os: ubuntu-latest, flags: "-m32 -DCISTA_SKIP_ALIGNMENT_CHECK" }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: windows-x86, os: windows-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - name: Install 32bit runtime
        if: matrix.name == 'linux-x86'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lib32stdc++6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read the buffers of every platform
        shell: bash
        run: |
          exe=artifacts/interop-${{ matrix.name }}/cista-interop
          chmod +x "$exe"*
          status=0
          for f in artifacts/*/*.bin; do
            "$exe" read "$f" || status=1
          done
          exit $status
